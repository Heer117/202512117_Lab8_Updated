# ============================================================
# PRODUCT SERVICE - ClusterIP (internal only)
# Access via: http://product-service:3002 (within lab8 namespace)
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: product-service
  namespace: lab8
  labels:
    app: product-service
    app.kubernetes.io/part-of: lab8
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  selector:
    app: product-service
  ports:
    - name: http
      port: 3002
      targetPort: 3002
