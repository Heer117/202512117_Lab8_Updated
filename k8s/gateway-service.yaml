# ============================================================
# API GATEWAY SERVICE - NodePort (Client-facing entry point)
# External access: http://<Node-IP>:30000
# Internal access: http://api-gateway:3000 (within cluster)
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: lab8
  labels:
    app: api-gateway
    app.kubernetes.io/part-of: lab8
    app.kubernetes.io/component: gateway
spec:
  type: NodePort
  selector:
    app: api-gateway
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      nodePort: 30000
