# ============================================================
# PRODUCT SERVICE DEPLOYMENT
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
  namespace: lab8
  labels:
    app: product-service
    app.kubernetes.io/part-of: lab8
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: product-service
  template:
    metadata:
      labels:
        app: product-service
        app.kubernetes.io/part-of: lab8
    spec:
      containers:
        - name: product-service
          image: 202512117_lab8/product-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3002
              name: http
          env:
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: lab8-mongodb-secret
                  key: MONGO_URI_PRODUCT
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 3002
            initialDelaySeconds: 45
            periodSeconds: 20
            failureThreshold: 3
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 3002
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
