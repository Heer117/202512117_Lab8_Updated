# ============================================================
# MONGODB SECRET - Sensitive configuration (Atlas URIs)
#
# IMPORTANT: This file contains TEMPLATE placeholders only.
# The actual base64-encoded Atlas URI is injected at deploy
# time via GitHub Actions Secrets and is NEVER committed.
#
# To generate base64 values locally (PowerShell):
#   [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes("mongodb+srv://user:pass@cluster0.eg8blnj.mongodb.net/"))
#
# To apply with real Atlas credentials, run:
#   kubectl create secret generic lab8-mongodb-secret \
#     --from-literal=MONGO_URI_USER="mongodb+srv://USER:PASS@cluster0.eg8blnj.mongodb.net/userdb" \
#     --from-literal=MONGO_URI_PRODUCT="mongodb+srv://USER:PASS@cluster0.eg8blnj.mongodb.net/productdb" \
#     --from-literal=MONGO_URI_ORDER="mongodb+srv://USER:PASS@cluster0.eg8blnj.mongodb.net/orderdb" \
#     -n lab8
#
# kubectl apply -f k8s/mongodb-secret.yaml
# ============================================================
apiVersion: v1
kind: Secret
metadata:
  name: lab8-mongodb-secret
  namespace: lab8
  labels:
    app.kubernetes.io/part-of: lab8
type: Opaque
data:
  # Base64-encoded MongoDB Atlas URIs per service database
  # Actual values injected by CI/CD pipeline from GitHub Secrets
  # Replace PLACEHOLDER values below with your real base64-encoded Atlas URIs:
  #
  # mongodb+srv://202512117_db_user:PASSWORD@cluster0.eg8blnj.mongodb.net/userdb
  MONGO_URI_USER: REPLACE_WITH_BASE64_ATLAS_URI_USER
  # mongodb+srv://202512117_db_user:PASSWORD@cluster0.eg8blnj.mongodb.net/productdb
  MONGO_URI_PRODUCT: REPLACE_WITH_BASE64_ATLAS_URI_PRODUCT
  # mongodb+srv://202512117_db_user:PASSWORD@cluster0.eg8blnj.mongodb.net/orderdb
  MONGO_URI_ORDER: REPLACE_WITH_BASE64_ATLAS_URI_ORDER
