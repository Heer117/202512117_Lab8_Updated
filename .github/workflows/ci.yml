# ============================================================
# GitHub Actions CI/CD Workflow - Lab 8
# WSSOA | Student ID: 202512117
#
# Flow: Push → Checkout → Build/Test (Maven) → Docker Image
#       → Push to GHCR (versioned with SHA) → K8s rollout
#
# Required GitHub Secrets:
#   DOCKER_USERNAME     - Docker Hub username (or GHCR_TOKEN)
#   DOCKER_PASSWORD     - Docker Hub password or PAT
#   MONGO_URI_USER      - MongoDB Atlas URI for user-service
#   MONGO_URI_PRODUCT   - MongoDB Atlas URI for product-service
#   MONGO_URI_ORDER     - MongoDB Atlas URI for order-service
# ============================================================
name: CI — Build, Test & Push Docker Images

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

env:
  REGISTRY: docker.io
  IMAGE_PREFIX: ${{ secrets.DOCKER_USERNAME }}/202512117-lab8

jobs:
  # ----------------------------------------------------------
  # JOB 1: Build & Test all Spring Boot services
  # ----------------------------------------------------------
  build-and-test:
    name: Build & Test Services
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up Java 17 (matches Spring Boot services)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # Step 3: Build & Test — User Service
      - name: Build & Test user-service
        working-directory: ./user-service
        run: mvn --no-transfer-progress clean verify

      # Step 4: Build & Test — Product Service
      - name: Build & Test product-service
        working-directory: ./product-service
        run: mvn --no-transfer-progress clean verify

      # Step 5: Build & Test — Order Service
      - name: Build & Test order-service
        working-directory: ./order-service
        run: mvn --no-transfer-progress clean verify

      # Step 6: Build & Test — API Gateway
      - name: Build & Test api-gateway
        working-directory: ./api-gateway
        run: mvn --no-transfer-progress clean verify

  # ----------------------------------------------------------
  # JOB 2: Build versioned Docker images & push to registry
  # Only runs on push to main/master (not on PRs)
  # ----------------------------------------------------------
  docker-build-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Log in to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Set up Docker Buildx for efficient multi-platform builds
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build and push API Gateway — tagged with git commit SHA for traceability
      - name: Build & Push api-gateway
        uses: docker/build-push-action@v5
        with:
          context: ./api-gateway
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-api-gateway:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-api-gateway:latest

      # Build and push User Service
      - name: Build & Push user-service
        uses: docker/build-push-action@v5
        with:
          context: ./user-service
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-user-service:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-user-service:latest

      # Build and push Product Service
      - name: Build & Push product-service
        uses: docker/build-push-action@v5
        with:
          context: ./product-service
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-product-service:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-product-service:latest

      # Build and push Order Service
      - name: Build & Push order-service
        uses: docker/build-push-action@v5
        with:
          context: ./order-service
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-order-service:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-order-service:latest

      # Print image tags for verification
      - name: Print image tags
        run: |
          echo "===== Versioned Docker Images ====="
          echo "api-gateway:    ${{ env.IMAGE_PREFIX }}-api-gateway:${{ github.sha }}"
          echo "user-service:   ${{ env.IMAGE_PREFIX }}-user-service:${{ github.sha }}"
          echo "product-service: ${{ env.IMAGE_PREFIX }}-product-service:${{ github.sha }}"
          echo "order-service:  ${{ env.IMAGE_PREFIX }}-order-service:${{ github.sha }}"
          echo "All images pushed successfully."
