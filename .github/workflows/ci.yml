# ============================================================
# GitHub Actions CI/CD Workflow - Lab 8
# WSSOA | Student ID: 202512117
#
# Flow: Push → Checkout → Build & Test (Maven) → Docker Images
#       (multi-stage: Maven build inside Docker) → Push to
#       Docker Hub with SHA tag → Summary
#
# Required GitHub Secrets (Settings → Secrets → Actions):
#   DOCKER_USERNAME  - Your Docker Hub username
#   DOCKER_PASSWORD  - Your Docker Hub password or access token
# ============================================================
name: CI — Build, Test & Push Docker Images

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  # ----------------------------------------------------------
  # JOB 1: Build & Test — runs Maven for all services
  # This gives fast feedback on test failures before Docker
  # ----------------------------------------------------------
  build-and-test:
    name: Build & Test (Maven)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build & Test — api-gateway
        working-directory: ./api-gateway
        run: mvn --no-transfer-progress clean verify

      - name: Build & Test — user-service
        working-directory: ./user-service
        run: mvn --no-transfer-progress clean verify

      - name: Build & Test — product-service
        working-directory: ./product-service
        run: mvn --no-transfer-progress clean verify

      - name: Build & Test — order-service
        working-directory: ./order-service
        run: mvn --no-transfer-progress clean verify

  # ----------------------------------------------------------
  # JOB 2: Docker Build & Push
  # Multi-stage Dockerfiles: Maven build + JRE runtime image
  # Tagged with git SHA for traceability
  # Only runs on push to main/master (not on pull requests)
  # ----------------------------------------------------------
  docker-build-push:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push'

    env:
      DOCKER_USER: ${{ secrets.DOCKER_USERNAME }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # api-gateway — SHA tag + latest
      - name: Build & Push api-gateway
        uses: docker/build-push-action@v5
        with:
          context: ./api-gateway
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/202512117-lab8-api-gateway:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/202512117-lab8-api-gateway:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # user-service — SHA tag + latest
      - name: Build & Push user-service
        uses: docker/build-push-action@v5
        with:
          context: ./user-service
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/202512117-lab8-user-service:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/202512117-lab8-user-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # product-service — SHA tag + latest
      - name: Build & Push product-service
        uses: docker/build-push-action@v5
        with:
          context: ./product-service
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/202512117-lab8-product-service:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/202512117-lab8-product-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # order-service — SHA tag + latest
      - name: Build & Push order-service
        uses: docker/build-push-action@v5
        with:
          context: ./order-service
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/202512117-lab8-order-service:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/202512117-lab8-order-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Print versioned image tags for submission evidence
      - name: Print versioned image tags
        run: |
          echo "=========================================="
          echo "  Versioned Docker Images — Lab 8"
          echo "=========================================="
          echo "api-gateway:     ${{ secrets.DOCKER_USERNAME }}/202512117-lab8-api-gateway:${{ github.sha }}"
          echo "user-service:    ${{ secrets.DOCKER_USERNAME }}/202512117-lab8-user-service:${{ github.sha }}"
          echo "product-service: ${{ secrets.DOCKER_USERNAME }}/202512117-lab8-product-service:${{ github.sha }}"
          echo "order-service:   ${{ secrets.DOCKER_USERNAME }}/202512117-lab8-order-service:${{ github.sha }}"
          echo "=========================================="
          echo "All images pushed to Docker Hub successfully."
