spring.application.name=api-gateway
server.port=3000

gateway.user-service-url=${USER_SERVICE_URL:http://localhost:3001}
gateway.product-service-url=${PRODUCT_SERVICE_URL:http://localhost:3002}
gateway.order-service-url=${ORDER_SERVICE_URL:http://localhost:3003}

# Actuator / Prometheus metrics (Part C)
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.metrics.export.prometheus.enabled=true